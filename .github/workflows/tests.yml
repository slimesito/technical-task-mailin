name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # `composer setup` migrates and the Pest suite runs against Postgres
    # (domain_checks_test), so the runner needs the same services as docker-compose.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: domain_checks
          POSTGRES_USER: domain_checks
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domain_checks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Create test database
        run: createdb -h 127.0.0.1 -U domain_checks domain_checks_test
        env:
          PGPASSWORD: secret

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
